name: "1. Update Issue Title"
run-name: Update issue title using GitHub API


on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    if: true # Disable this job
    env: 
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Update issue title using GH CLI
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          PREFIX="PRO"

          YEAR=$(date +%y)
          PADDED_NUM=$(printf "%04d" "$ISSUE_NUMBER")
          IDENTIFIER="${PREFIX}-${YEAR}${PADDED_NUM}"

          OLD_TITLE="${{ github.event.issue.title }}"
          NEW_TITLE="${IDENTIFIER}: ${OLD_TITLE}"

          gh issue edit "$ISSUE_NUMBER" --title "$NEW_TITLE" --repo "${{ github.repository }}"
